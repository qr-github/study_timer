<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <style>
        .bg-a { stop-color: #2b2b30; }
        .bg-b { stop-color: #030303; }
        @media (prefers-color-scheme: dark) {
            .bg-a { stop-color: #3a3a40; }
            .bg-b { stop-color: #111114; }
        }
    </style>
    <defs>
        <!--背景：左上から右下への斜めグラデーション-->
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" class="bg-a"/>
            <stop offset="1" class="bg-b"/>
        </linearGradient>
        <!--上辺の縁の光-->
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
            <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <!--円弧：起点から先端へ明るくなる3区間-->
        <linearGradient id="arc1" gradientUnits="userSpaceOnUse" x1="256" y1="106" x2="406" y2="256">
            <stop offset="0" stop-color="#55555b"/>
            <stop offset="1" stop-color="#8a8a90"/>
        </linearGradient>
        <linearGradient id="arc2" gradientUnits="userSpaceOnUse" x1="406" y1="256" x2="256" y2="406">
            <stop offset="0" stop-color="#8a8a90"/>
            <stop offset="1" stop-color="#c2c2c6"/>
        </linearGradient>
        <linearGradient id="arc3" gradientUnits="userSpaceOnUse" x1="256" y1="406" x2="106" y2="256">
            <stop offset="0" stop-color="#c2c2c6"/>
            <stop offset="1" stop-color="#f7f7f7"/>
        </linearGradient>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="9"/>
        </filter>
    </defs>

    <!--ベース-->
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

    <!--目盛り（12・3・6・9時は長く太く）-->
    <g stroke="#ffffff" stroke-opacity="0.22" stroke-linecap="round">
        <g stroke-width="10">
            <line x1="256" y1="36" x2="256" y2="60"/>
            <line x1="476" y1="256" x2="452" y2="256"/>
            <line x1="256" y1="476" x2="256" y2="452"/>
            <line x1="36" y1="256" x2="60" y2="256"/>
        </g>
        <g stroke-width="6" transform="rotate(30 256 256)">
            <line x1="256" y1="38" x2="256" y2="52"/>
            <line x1="256" y1="474" x2="256" y2="460"/>
        </g>
        <g stroke-width="6" transform="rotate(60 256 256)">
            <line x1="256" y1="38" x2="256" y2="52"/>
            <line x1="256" y1="474" x2="256" y2="460"/>
        </g>
        <g stroke-width="6" transform="rotate(120 256 256)">
            <line x1="256" y1="38" x2="256" y2="52"/>
            <line x1="256" y1="474" x2="256" y2="460"/>
        </g>
        <g stroke-width="6" transform="rotate(150 256 256)">
            <line x1="256" y1="38" x2="256" y2="52"/>
            <line x1="256" y1="474" x2="256" y2="460"/>
        </g>
    </g>

    <!--残り時間のトラック-->
    <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="44"/>

    <!--プログレス円弧（12時から時計回りに3/4周）-->
    <g fill="none" stroke-width="44">
        <path d="M256 106 A150 150 0 0 1 405.98 258.62" stroke="url(#arc1)"/>
        <path d="M406 256 A150 150 0 0 1 253.38 405.98" stroke="url(#arc2)"/>
        <path d="M256 406 A150 150 0 0 1 106 256" stroke="url(#arc3)"/>
    </g>
    <circle cx="256" cy="106" r="22" fill="#55555b"/>
    <circle cx="106" cy="256" r="22" fill="#f7f7f7"/>

    <!--先端の光点-->
    <circle cx="106" cy="256" r="26" fill="#ffb547" opacity="0.6" filter="url(#glow)"/>
    <circle cx="106" cy="256" r="12" fill="#ffb547"/>

    <!--中心のハブ-->
    <circle cx="256" cy="256" r="14" fill="#f7f7f7"/>
</svg>
